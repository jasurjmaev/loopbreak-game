<!DOCTYPE html>
<html lang="uz">
<head>

<title>LOOPBREAK — Haqiqatni top</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080c16;--panel:#101827;--panel2:#151f31;--line:#27364b;--text:#edf4ff;--muted:#93a4bc;--cyan:#65f3e2;--pink:#ff4e83;--gold:#ffd477;--green:#8dffb0;--shadow:0 18px 50px #0007}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#17334a 0,transparent 40%),radial-gradient(ellipse at 100% 20%,#251634 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:0 0 calc(84px + env(safe-area-inset-bottom));}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:linear-gradient(135deg,#1b2b40,#111a29);border-radius:14px;padding:12px 14px;transition:transform .15s,border-color .15s}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.primary{background:linear-gradient(135deg,#67f4e0,#55a8ff);color:#06121c;border:0;font-weight:850}.danger{border-color:#6e2945;background:linear-gradient(135deg,#351827,#211522)}.quiet{background:#0e1725}.hidden{display:none!important}.app{max-width:760px;margin:auto;padding:18px 16px 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),#8f7cff);display:grid;place-items:center;color:#07111a;font-weight:1000;font-size:21px;box-shadow:0 0 28px #65f3e233}.brand h1{font-size:16px;letter-spacing:2px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.8px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--cyan);font-size:12px;white-space:nowrap}.panel{background:linear-gradient(150deg,#131e2eeb,#0d1522f2);border:1px solid #26364b;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}.hero{padding:24px 20px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-65px;background:#65f3e212;filter:blur(3px)}h2{font-size:27px;line-height:1.15;margin:10px 0 12px}h3{font-size:17px;margin:0 0 9px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;min-height:105px;padding:15px}.tile .emoji{font-size:25px;display:block;margin-bottom:8px}.tile b{display:block}.tile small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar{height:8px;background:#253247;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#8b7cff);border-radius:99px;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1320;border:1px solid #253248;border-radius:15px;padding:11px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#080c16ed;border-top:1px solid #26364b;backdrop-filter:blur(18px)}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav button{border:0;background:transparent;padding:8px 4px;font-size:11px;color:var(--muted);border-radius:12px}.nav button.active{background:#152638;color:var(--cyan)}.nav span{display:block;font-size:19px}.story-art{height:145px;border-radius:17px;border:1px solid #31445c;background:radial-gradient(ellipse at 50% 100%,#344c67 0,transparent 44%),linear-gradient(145deg,#101c2d,#080d16);display:grid;place-items:center;font-size:55px;margin:12px 0;position:relative;overflow:hidden}.story-art:before,.story-art:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 14px,#91b4d008 15px 16px)}.story-art:after{background:linear-gradient(90deg,transparent 49.8%,#65f3e222 50%,transparent 50.2%)}.choices{display:grid;gap:9px;margin-top:15px}.choice{text-align:left;padding:14px;border-radius:15px;display:flex;gap:11px;align-items:flex-start}.choice .letter{border:1px solid #4b607b;border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;color:var(--cyan);font-weight:800}.choice small{display:block;color:var(--muted);margin-top:3px}.notice{border-left:3px solid var(--cyan);padding:10px 12px;background:#142536;border-radius:0 12px 12px 0;margin:12px 0}.clue{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #26364b}.clue:last-child{border-bottom:0}.clue-icon{font-size:23px}.clue p{margin:2px 0 0;color:var(--muted);font-size:13px}.tag{display:inline-block;font-size:10px;color:var(--gold);border:1px solid #6c5730;border-radius:99px;padding:3px 7px;margin-left:5px}.field{width:100%;padding:13px;border-radius:12px;background:#080f1b;border:1px solid #304159;color:var(--text);margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}.toast{position:fixed;z-index:30;bottom:94px;left:50%;transform:translateX(-50%);max-width:90vw;background:#e9f7ff;color:#07111b;border-radius:12px;padding:11px 15px;font-weight:700;box-shadow:var(--shadow)}.ending{border:1px solid #6a5b35;background:linear-gradient(140deg,#292517,#121a26);border-radius:18px;padding:18px;margin-top:14px}.footer-note{font-size:11px;color:var(--muted);text-align:center;padding:8px}.badge{font-size:11px;border:1px solid #31445c;border-radius:99px;padding:5px 8px;color:var(--muted)}@media(min-width:600px){.app{padding-top:24px}.hero{padding:30px}.story-art{height:190px}.tile{min-height:120px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">L</div><div><h1>LOOPBREAK</h1><small>HAQIQATNI TOP</small></div></div>
    <div class="pill" id="rankPill">LVL 01 · KUZATUVCHI</div>
  </header>
  <main id="view"></main>
  <div class="footer-note">LOOPBREAK • Har bir tanlov iz qoldiradi.</div>
</div>
<nav class="bottom"><div class="nav">
  <button data-page="home" class="active"><span>⌂</span>Bosh sahifa</button>
  <button data-page="story"><span>◈</span>Hikoya</button>
  <button data-page="evidence"><span>▤</span>Dalillar</button>
  <button data-page="profile"><span>◎</span>Profil</button>
</div></nav>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#080c16');tg?.setBackgroundColor?.('#080c16')}catch(e){}
const KEY='loopbreak_save_v4';
const fresh=()=>({name:'Kuzatuvchi',xp:0,level:1,trust:50,danger:10,chapter:0,runId:0,choices:[],usedVariants:{},clues:[],history:[],endings:[],achievements:[],missions:{first:false,clues:false,calm:false},sound:true,volume:0.35,finished:false,stats:{runs:0,good:0,bad:0,secret:0}});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')};state.stats={...fresh().stats,...(state.stats||{})};state.usedVariants=state.usedVariants||{};state.clues=state.clues||[];state.choices=state.choices||[];state.history=state.history||[];state.endings=state.endings||[];state.achievements=state.achievements||[];state.missions=state.missions||fresh().missions}catch(e){state=fresh()}
const scenes=[
 {id:'arrival',title:'03:17 — Qaytgan qo‘ng‘iroq',art:'☎️',place:'Tungi bekat',text:'Telefoning uch marta titradi. Ekranda o‘zingning raqaming. Javob berganingda, shivirlash eshitildi: “Agar bu xabarni eshitsang, demak men yana kech qoldim. Soatga ishonma.” Uzoqda kamera qizil chirog‘i miltilladi.',variants:['Telefoning uch marta titradi. Ekranda o‘zingning raqaming. “Soatga ishonma”, dedi notanish ovoz.','Tungi bekatda yolg‘izsan. O‘z raqamingdan qo‘ng‘iroq keldi: “Bu safar eshikni ochma.”'],choices:[
 {t:'Qo‘ng‘iroqni yozib ol va atrofni kuzat',d:'Avval dalil yig‘asan.',trust:5,danger:0,xp:15,clue:'voice',msg:'Yozuvda orqa fonda uchta qisqa signal bor.'},
 {t:'Darhol kameraga yaqinlash',d:'Tez harakat — ko‘proq xavf.',trust:-2,danger:12,xp:12,clue:'camera',msg:'Kamera tagidan yirtilgan nazorat varag‘ini topding.'},
 {t:'Telefonni o‘chirib, bekatdan ket',d:'Xavfsizroq, lekin nimanidir boy berishing mumkin.',trust:0,danger:-5,xp:8,msg:'Ketishga ulgurmay, cho‘ntagingda noma’lum raqamdan yangi xabar paydo bo‘ldi.'}]},
 {id:'camera',title:'Ko‘r-ko‘rona nuqta',art:'📹',place:'Xavfsizlik xonasi',text:'Monitorlarda bir xil yo‘lak turibdi. Har bir yozuv 03:17 da uziladi. Bitta kamera vaqtni 03:16 deb ko‘rsatmoqda. Qaysi tasvirni tekshirasan?',variants:['Monitorlar 03:17 da bir zumga qorayadi. Faqat 4-kamera bir daqiqa ortda qolgan.','Yozuvlar orasida vaqt sakraydi. Bitta kamera soatga bo‘ysunmayapti.'],puzzle:'camera',choices:[
 {t:'03:16 ko‘rsatayotgan kamerani och',d:'Vaqt tafovutini tekshir.',trust:7,danger:0,xp:20,clue:'camera_time',msg:'Yozuvdagi soya eshik ochilishidan oldin paydo bo‘ladi.'},
 {t:'03:17 dagi barcha yozuvni o‘chir',d:'Dalil yo‘qolishi mumkin.',trust:-8,danger:8,xp:5,msg:'Tizim o‘chirishni qayd etdi. Kimdir buni sezishi mumkin.'},
 {t:'Kuzatuvchi xodimdan so‘ra',d:'Odamlar ham dalil, ham xavf.',trust:3,danger:3,xp:12,clue:'guard',msg:'Xodim “soatlarni har juma kimdir qayta sozlaydi” dedi.'}]},
 {id:'cipher',title:'Devordagi shifr',art:'⌁',place:'Yopiq arxiv',text:'Jurnal chetida bitta satr yozilgan: “ISHONCH — kalit, lekin kalit ham yolg‘on gapirishi mumkin.” Harflar orasida yashirin buyruq bor. Xabarni ochish uchun 7 harfli javobni kiriting.',variants:['Chang bosgan jurnal ichida yetti harfli shifr bor. Uning yonida: “Ishonchni tekshir.”','Arxivdagi qog‘ozda harflar chalkashtirilgan. Yetti harfli kalitni top.'],puzzle:'cipher',choices:[
 {t:'Shifrni yechishga vaqt ajrat',d:'Javobni kiritib, dalilni och.',trust:4,danger:0,xp:20},
 {t:'Qog‘ozni cho‘ntakka sol',d:'Keyinroq tekshirish mumkin.',trust:0,danger:2,xp:8,clue:'cipher_note',msg:'Qog‘ozni olding, ammo kodning bir qismi yirtilgan.'},
 {t:'Arxivni darhol tark et',d:'Iz qoldirmaslikka urin.',trust:-1,danger:-3,xp:6,msg:'Yo‘lak jim. Lekin eshik ortidan ikki marta taqillash eshitildi.'}]},
 {id:'call',title:'Ikkinchi ovoz',art:'📱',place:'Yerosti yo‘lagi',text:'Telefon yana jiringladi. Bu safar ovoz sening ovozingga o‘xshaydi: “U senga yordam bermayapti. Ishonch darajangni tekshir. Orqangga qaramagin.” Orqada oyoq tovushi yaqinlashmoqda.',variants:['Telefonning narigi tomonida o‘z ovozing eshitildi: “U senga yolg‘on gapiryapti.”','Noma’lum ovoz sening barcha qarorlaringni biladi. U faqat bitta savol berdi: “Kimga ishonding?”'],choices:[
 {t:'Ovozdan aniq dalil talab qil',d:'Shoshilma, savol ber.',trust:8,danger:2,xp:18,clue:'caller',msg:'Ovoz 03:17 dagi yozuvni bilishini aytdi.'},
 {t:'Ovoz aytgan tomonga yugur',d:'Tezlik xavfli bo‘lishi mumkin.',trust:-3,danger:14,xp:10,msg:'Yo‘lak oxiri berk. Orqadagi qadamlar to‘xtadi.'},
 {t:'Telefonni ovoz yozuviga qo‘yib, orqaga yur',d:'Dalil yig‘ib, masofani saqla.',trust:4,danger:-2,xp:16,clue:'call_record',msg:'Yozuvda fon shovqini orasidan “B-12” degan so‘z chiqdi.'}]},
 {id:'vault',title:'B-12 xonasi',art:'🚪',place:'Maxfiy xona',text:'B-12 eshigi ochiq. Ichkarida uchta papka bor: “Haqiqat”, “Qopqon”, “Sening xotirang”. Stol ustida esa bitta jumla: “Oxirgi tanloving oldingi barcha tanlovlaringni o‘zgartirishi mumkin.”',variants:['B-12 ichida uchta papka va o‘chib-yonayotgan ekran turibdi. Qaysi biri haqiqiyligini bilmayapsan.','Eshik ortida uchta papka bor. Ularning birida sening isming yozilgan.'],choices:[
 {t:'“Haqiqat” papkasini och',d:'Haqiqat og‘ir bo‘lishi mumkin.',trust:8,danger:3,xp:25,clue:'truth_file',ending:'good',msg:'Papka ichidagi dalillar voqealarni bir-biriga bog‘ladi.'},
 {t:'“Qopqon” papkasini tekshir',d:'Xavfga yaqinlashasan.',trust:-5,danger:15,xp:22,clue:'trap_file',ending:'bad',msg:'Signal ishga tushdi. Eshiklar avtomatik qulflandi.'},
 {t:'Ekrandagi o‘z xotirangni tikla',d:'Eng xavfli savol: sen nimani unutding?',trust:5,danger:0,xp:30,clue:'memory_file',ending:'memory',msg:'Ekranda avvalgi qarorlaring paydo bo‘ldi.'}]}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){state.level=Math.max(1,Math.floor(state.xp/100)+1);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};updateTop()}
function updateTop(){$('rankPill').textContent=`LVL ${String(state.level).padStart(2,'0')} · ${state.level<3?'KUZATUVCHI':state.level<6?'IZQIDIRUVCHI':'HAQIQAT IZLOVCHI'}`}
let page='home',audioCtx=null,ambientTimer=null;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2400)}
function sound(freq=440,duration=.12,type='sine'){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=state.volume*.12;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(e){}}
function ambient(){if(!state.sound||ambientTimer)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=48;g.gain.value=state.volume*.012;o.connect(g);g.connect(audioCtx.destination);o.start();ambientTimer={o,g}}catch(e){}}
function stopAmbient(){if(ambientTimer){try{ambientTimer.o.stop()}catch(e){}ambientTimer=null}}
function render(){updateTop();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=$('view');if(page==='home')v.innerHTML=homeHTML();else if(page==='story')v.innerHTML=storyHTML();else if(page==='evidence')v.innerHTML=evidenceHTML();else if(page==='profile')v.innerHTML=profileHTML();bind()}
function homeHTML(){const next=state.finished?'Yangi siklni boshlash':'Hikoyani davom ettirish';return `<section class="panel hero"><div class="eyebrow">Interaktiv psixologik triller</div><h2>Haqiqat har doim ham<br><span style="color:var(--cyan)">ko‘ringanidek emas.</span></h2><p class="muted">Har qaror iz qoldiradi. Ishonchni saqla, xavfni o‘lcha va yashirin haqiqatni top.</p><div class="actions"><button class="primary" id="startBtn">▶ ${next}</button><button id="continueBtn">◈ Dalillar</button></div><div style="margin-top:18px"><div class="row small"><span>Keyingi darajagacha</span><b>${state.xp%100}/100 XP</b></div><div class="bar"><i style="width:${state.xp%100}%"></i></div></div></section>
<div class="stats"><div class="stat"><strong>${state.xp}</strong><span>Jami XP</span></div><div class="stat"><strong>${state.clues.length}</strong><span>Dalillar</span></div><div class="stat"><strong>${state.stats.runs}</strong><span>Sikllar</span></div></div>
<h3 style="margin:20px 2px 10px">Markaz</h3><div class="grid"><button class="tile" data-go="story"><span class="emoji">🎭</span><b>Hikoya</b><small>Tanlovlar va yakunlar</small></button><button class="tile" data-go="evidence"><span class="emoji">🗂️</span><b>Dalillar taxtasi</b><small>${state.clues.length} ta dalil yig‘ildi</small></button><button class="tile" data-go="profile"><span class="emoji">🕶️</span><b>Maxfiy profil</b><small>Daraja va yutuqlar</small></button><button class="tile" id="missionsBtn"><span class="emoji">🎯</span><b>Missiyalar</b><small>Bugungi vazifalar</small></button></div>
<section class="panel" style="margin-top:14px"><div class="row"><h3>Joriy holat</h3><span class="badge">${state.finished?'Yakunlangan':'Faol'}</span></div><div class="row small"><span>🤝 Ishonch</span><b>${state.trust}/100</b></div><div class="bar"><i style="width:${state.trust}%;background:linear-gradient(90deg,#65f3e2,#8dffb0)"></i></div><div class="row small" style="margin-top:12px"><span>⚠️ Xavf</span><b>${state.danger}/100</b></div><div class="bar"><i style="width:${state.danger}%;background:linear-gradient(90deg,#ffd477,#ff4e83)"></i></div></section>`}
function getScene(){if(state.chapter>=scenes.length)return null;const base=scenes[state.chapter];const variants=base.variants||[];if(!variants.length)return {...base};const used=state.usedVariants[base.id]||[];const options=variants.map((t,i)=>({t,i})).filter(x=>!used.includes(x.i));const pick=options.length?options[Math.floor(Math.random()*options.length)]:{t:base.text,i:-1};if(pick.i>=0){state.usedVariants[base.id]=[...used,pick.i].slice(-Math.max(1,variants.length-1));save()}return {...base,text:pick.t}}
let activeScene=null;
function storyHTML(){if(state.finished)return `<section class="panel"><div class="eyebrow">Sikl yakunlandi</div><h2>Sen o‘z tanlovlaringni qilding.</h2><p class="muted">Boshqa yo‘lni sinash uchun yangi siklni boshlashing mumkin. Yig‘ilgan XP va ochilgan yutuqlar saqlanadi.</p><button class="primary" id="restartBtn">↻ Yangi sikl</button><button id="reviewBtn" style="width:100%;margin-top:8px">Yakunlarimni ko‘rish</button></section>`;activeScene=getScene();if(!activeScene)return '';const s=activeScene;let extra='';if(s.puzzle==='camera')extra=`<div class="notice">🔎 Kamera savoli: vaqt farqi qaysi yozuvda? <b>03:16</b> yozuvini tanlasang, muhim iz topishing mumkin.</div>`;if(s.puzzle==='cipher')extra=`<div class="notice">🔐 Shifr kaliti 7 harfli. Javobni pastga kiriting.</div><input class="field" id="cipherInput" maxlength="30" placeholder="Shifr javobi..."><button id="cipherBtn" class="primary" style="width:100%">Shifrni tekshirish</button>`;return `<section class="panel"><div class="row"><span class="eyebrow">BO‘LIM ${state.chapter+1} / ${scenes.length}</span><span class="badge">${esc(s.place)}</span></div><div class="story-art">${s.art}</div><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p>${extra}<div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span><b>${esc(c.t)}</b><small>${esc(c.d)}</small></span></button>`).join('')}</div><div class="row small" style="margin-top:15px"><span>🤝 Ishonch: ${state.trust}</span><span>⚠️ Xavf: ${state.danger}</span></div></section><div class="actions"><button id="soundBtn">${state.sound?'🔊 Ovoz yoqilgan':'🔇 Ovoz o‘chiq'}</button><button id="evidenceBtn">🗂️ Dalillar (${state.clues.length})</button></div>`}
function evidenceHTML(){const clues=state.clues;return `<section class="panel"><div class="eyebrow">Dalil va izlar</div><h2>Dalillar taxtasi</h2><p class="muted">Har bir topilma hikoyaning ma’nosini o‘zgartirishi mumkin.</p>${clues.length?clues.map(id=>{const c=clueInfo[id]||{icon:'🔎',title:id,desc:'Noma’lum dalil.'};return `<div class="clue"><div class="clue-icon">${c.icon}</div><div><b>${esc(c.title)}</b><p>${esc(c.desc)}</p></div></div>`}).join(''):'<div class="notice">Hozircha dalil yo‘q. Hikoyani o‘ynab, atrofni diqqat bilan tekshir.</div>'}<button class="primary" id="backStory" style="width:100%;margin-top:12px">Hikoyaga qaytish</button></section><section class="panel"><h3>Yashirin xabar</h3><p class="muted">Ovoz, kamera va qo‘ng‘iroq dalillari bir-biriga bog‘liq bo‘lishi mumkin. Hammasini yig‘ib, keyingi siklda boshqa qarorlarni sinab ko‘r.</p></section>`}
const clueInfo={voice:{icon:'🎙️',title:'Qo‘ng‘iroq yozuvi',desc:'Fon ortida uchta qisqa signal bor.'},camera:{icon:'📹',title:'Kamera nazorat varag‘i',desc:'Kamera tagidan topilgan yirtilgan varaq.'},camera_time:{icon:'⏱️',title:'03:16 yozuvi',desc:'Soya eshik ochilishidan oldin paydo bo‘lgan.'},guard:{icon:'🧑‍✈️',title:'Xodimning guvohligi',desc:'Soatlar har juma kimdir tomonidan qayta sozlanadi.'},cipher_note:{icon:'🔐',title:'Yirtilgan shifr',desc:'Kodning bir qismi yo‘q, lekin ishora qolgan.'},caller:{icon:'📞',title:'Ikkinchi ovoz',desc:'Ovoz 03:17 dagi yozuvni biladi.'},call_record:{icon:'🎧',title:'B-12 yozuvi',desc:'Fon shovqinida “B-12” degan so‘z eshitiladi.'},truth_file:{icon:'📁',title:'Haqiqat papkasi',desc:'Dalillar voqealarni bir-biriga bog‘ladi.'},trap_file:{icon:'⚠️',title:'Qopqon papkasi',desc:'Signal ishga tushdi va eshiklar qulflandi.'},memory_file:{icon:'🧠',title:'Xotira parchasi',desc:'Ekran avvalgi qarorlaringni qaytardi.'},cipher:{icon:'🔓',title:'Shifr yechildi',desc:'ISHONMA — shifr xabari to‘liq ochildi.'}};
function profileHTML(){const ach=[['🧩','Birinchi iz','Birinchi dalilni top',state.clues.length>=1],['🎧','Eshituvchi','Ovoz dalilini top',state.clues.includes('voice')||state.clues.includes('call_record')],['🧠','Xotira ustasi','Xotira faylini top',state.clues.includes('memory_file')],['🌟','Yaxshi yakun','Haqiqatni top',state.stats.good>0],['🕳️','Yashirin yakun','Maxfiy yo‘lni och',state.stats.secret>0]];return `<section class="panel"><div class="row"><div><div class="eyebrow">Maxfiy profil</div><h2>${esc(state.name)}</h2><p class="muted">Daraja ${state.level} · ${state.level<3?'Kuzatuvchi':state.level<6?'Izquvar':'Haqiqat izlovchi'}</p></div><div style="font-size:44px">🕶️</div></div><input class="field" id="nameInput" maxlength="24" value="${esc(state.name)}" aria-label="Profil nomi"><button id="saveName" class="primary" style="width:100%">Nomni saqlash</button></section><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>XP</span></div><div class="stat"><strong>${state.stats.good}</strong><span>Yaxshi yakun</span></div><div class="stat"><strong>${state.stats.bad}</strong><span>Yomon yakun</span></div></div><section class="panel" style="margin-top:14px"><h3>🏅 Yutuqlar</h3>${ach.map(a=>`<div class="clue"><div class="clue-icon">${a[0]}</div><div><b>${a[1]} ${a[3]?'<span class="tag">OCHILDI</span>':''}</b><p>${a[2]}</p></div></div>`).join('')}</section><section class="panel"><h3>⚙️ Sozlamalar</h3><div class="row"><span>Atmosfera ovozi</span><button id="toggleSound">${state.sound?'Yoqilgan':'O‘chirilgan'}</button></div><label class="small muted" for="volume">Ovoz balandligi: ${Math.round(state.volume*100)}%</label><input class="field" id="volume" type="range" min="0" max="1" step=".05" value="${state.volume}"><p class="small muted">Progress ushbu qurilmada saqlanadi. Brauzer ma’lumotlari o‘chirilsa, saqlangan o‘yin ham o‘chishi mumkin.</p><button class="danger" id="resetBtn" style="width:100%">Progressni tozalash</button></section>`}
function addClue(id){if(id&&!state.clues.includes(id)){state.clues.push(id);state.missions.clues=true;toast('Dalil topildi: '+(clueInfo[id]?.title||id));}}
function finishEnding(type){state.finished=true;state.stats.runs++;let title,desc;if(type==='secret'){title='MAXFIY YAKUN: LOOP BREAK';desc='Barcha belgilar bir-biriga mos tushdi. Sen faqat voqeani yechmading — siklning o‘zini ham buzding.';state.stats.secret++;}else if(type==='good'){title='YAXSHI YAKUN: HAQIQAT';desc='Dalillarni birlashtirding. Haqiqat oshkor bo‘ldi, lekin oxirgi qo‘ng‘iroqning egasi hanuz noma’lum.';state.stats.good++;}else if(type==='memory'){title='XOTIRA YAKUNI';desc='O‘tmishingni qayta ko‘rding. Endi bilasan: bu voqea sen o‘ylagandan ancha oldin boshlangan.';state.stats.good++;}else{title='YOMON YAKUN: QOPQON';desc='Signal ishga tushdi. Sen dalil topding, ammo bu safar dalil seni ham topdi.';state.stats.bad++;}state.endings.push({type,title,at:Date.now()});state.history.push({chapter:state.chapter,type});save();sound(type==='bad'?130:680,.35,'triangle');tg?.sendData?.(JSON.stringify({event:'ending',type,xp:state.xp,clues:state.clues.length}));$('view').innerHTML=`<section class="panel"><div class="eyebrow">Sikl yakunlandi</div><div class="story-art">${type==='bad'?'🚨':type==='secret'?'🌀':'🔓'}</div><div class="ending"><h2>${title}</h2><p>${desc}</p><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>XP jami</span></div><div class="stat"><strong>${state.clues.length}</strong><span>Dalil</span></div><div class="stat"><strong>${state.trust}</strong><span>Ishonch</span></div></div></div><button class="primary" id="restartBtn" style="width:100%;margin-top:14px">↻ Yangi sikl</button><button id="evidenceBtn" style="width:100%;margin-top:8px">Dalillarni ko‘rish</button></section>`;bind()}
function choose(i){const s=activeScene||getScene(),c=s.choices[i];if(!c)return;state.choices.push({scene:s.id,choice:i});state.trust=Math.max(0,Math.min(100,state.trust+(c.trust||0)));state.danger=Math.max(0,Math.min(100,state.danger+(c.danger||0)));state.xp+=c.xp||10;addClue(c.clue);state.history.push({scene:s.id,choice:i,at:Date.now()});state.missions.first=true;if(state.trust>=70&&state.danger<=30)state.missions.calm=true;save();sound([320,440,560][i],.15);let msg=c.msg||'Tanloving qayd etildi.';if(s.puzzle==='camera'&&i===0&&!state.clues.includes('camera_time'))addClue('camera_time');if(s.puzzle==='cipher'&&i===0){toast('Shifrni tekshirish uchun yuqoridagi maydonga ISHONMA yoz.');render();return}
if(s.id==='vault'){let ending=c.ending||'bad';if(ending==='good'&&state.clues.length>=3&&state.trust>=60&&state.danger<=55)ending='secret';finishEnding(ending);return}
state.chapter++;if(state.chapter>=scenes.length){finishEnding(state.trust>=60&&state.danger<=45&&state.clues.length>=3?'secret':state.trust>=45?'good':'bad');return}save();render();toast(msg);window.scrollTo({top:0,behavior:'smooth'})}
function startRun(){if(state.finished){state.chapter=0;state.finished=false;state.trust=50;state.danger=10;state.choices=[];state.runId++;state.missions={first:false,clues:false,calm:false};}else if(state.chapter===0&&state.choices.length===0){state.runId++}save();page='story';render();sound(520,.16);window.scrollTo(0,0)}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});$('startBtn')?.addEventListener('click',startRun);$('continueBtn')?.addEventListener('click',()=>{page='evidence';render()});$('backStory')?.addEventListener('click',()=>{page='story';render()});$('evidenceBtn')?.addEventListener('click',()=>{page='evidence';render()});$('soundBtn')?.addEventListener('click',()=>{state.sound=!state.sound;if(!state.sound)stopAmbient();else{sound(500,.12);ambient()}save();render()});$('toggleSound')?.addEventListener('click',()=>{state.sound=!state.sound;if(!state.sound)stopAmbient();else{sound(500,.12);ambient()}save();render()});$('volume')?.addEventListener('input',e=>{state.volume=Number(e.target.value);save();const lab=document.querySelector('label[for="volume"]');if(lab)lab.textContent='Ovoz balandligi: '+Math.round(state.volume*100)+'%';if(ambientTimer)ambientTimer.g.gain.value=state.volume*.012});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));$('cipherBtn')?.addEventListener('click',()=>{const val=($('cipherInput')?.value||'').trim().toUpperCase().replace(/\s/g,'');if(val==='ISHONMA'){addClue('cipher');state.xp+=20;state.trust=Math.min(100,state.trust+8);save();toast('Shifr yechildi! +20 XP');state.chapter++;render()}else{state.danger=Math.min(100,state.danger+4);save();sound(110,.2,'sawtooth');toast('Shifr noto‘g‘ri. Yana bir ishorani tekshir.')}});$('restartBtn')?.addEventListener('click',()=>{state.chapter=0;state.finished=false;state.trust=50;state.danger=10;state.choices=[];state.runId++;state.missions={first:false,clues:false,calm:false};save();page='story';render();window.scrollTo(0,0)});$('reviewBtn')?.addEventListener('click',()=>toast(state.endings.map(e=>e.title).join(' · ')||'Hali yakun yo‘q'));$('saveName')?.addEventListener('click',()=>{const n=($('nameInput')?.value||'').trim();if(n){state.name=n.slice(0,24);save();render();toast('Profil nomi saqlandi')}});$('resetBtn')?.addEventListener('click',()=>{if(confirm('Barcha progressni tozalashni xohlaysizmi?')){stopAmbient();state=fresh();save();page='home';render();toast('Progress tozalandi')}});$('missionsBtn')?.addEventListener('click',()=>{alert('MISSIYALAR\\n'+(state.missions.first?'✅':'⬜')+' Birinchi tanlovni qil\\n'+(state.missions.clues?'✅':'⬜')+' Bir dalil top\\n'+(state.missions.calm?'✅':'⬜')+' Ishonchni 70+ saqla va xavfni 30 dan past tut')})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAmbient()});document.addEventListener('pointerdown',()=>{if(state.sound)ambient()},{once:true});render();
})();
</script>
</body>
</html>
